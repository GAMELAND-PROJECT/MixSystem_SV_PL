// GameLand LAN Host Performance Profile
// Balanced client-side settings for smooth New Game / LAN hosting.

echo ">> GAMELAND LAN HOST PROFILE LOADED"

developer "0"
fps_max "101"
fps_modem "0"

rate "100000"
cl_cmdrate "101"
cl_updaterate "101"
ex_interp "0.01"

// Low latency audio for crystal-clear footsteps
hisound "1"
_snd_mixahead "0.06"
room_off "1"

net_graph "0"
cl_showfps "0"

mp_decals "128"
r_decals "128"
max_shells "15"
max_smokepuffs "15"
cl_weather "0"
fastsprites "1"

gl_cull "1"
gl_keeptjunctions "1"
gl_lightholes "1"
gl_round_down "0"
gl_picmip "0"
gl_max_size "512"
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_wateramp "0"
r_detailtextures "0"
r_dynamic "1"
r_mmx "1"
r_novis "0"
cl_himodels "0"
gl_lan_host_render "0"
gl_lan_host_skip_sprites "0"
gl_lan_host_skip_particles "0"
gl_lan_host_skip_dlights "0"
gl_lan_host_entity_distance "8192"

violence_ablood "1"
violence_agibs "0"
violence_hblood "1"
violence_hgibs "0"

alias gl_lan_perf "mp_decals 64; r_decals 64; max_shells 5; max_smokepuffs 5; cl_weather 0; fastsprites 2; gl_cull 1; gl_round_down 1; gl_picmip 1; gl_max_size 256; gl_wateramp 0; r_detailtextures 0; r_dynamic 0; cl_himodels 0; gl_lan_host_entity_distance 4096; echo GL LAN PERF"
alias gl_lan_quality "mp_decals 128; r_decals 128; max_shells 25; max_smokepuffs 25; cl_weather 1; fastsprites 0; gl_round_down 0; gl_picmip 0; gl_max_size 512; gl_texturemode GL_LINEAR_MIPMAP_LINEAR; r_dynamic 1; gl_lan_host_render 0; gl_lan_host_entity_distance 8192; echo GL LAN QUALITY"
alias gl_lan_debug "developer 1; net_graph 3; cl_showfps 1; gl_lan_status; gl_sound_status"
