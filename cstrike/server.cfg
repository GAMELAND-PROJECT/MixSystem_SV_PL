// ============================================================
// GameLand BasePack
// Main Server Configuration (Elite Russian ReHLDS Standard)
// ============================================================

hostname "GameLand CS 1.6 #1 (Competitive)"

// --- Network & Tickrate Tuning (101 Tick / 100K Rate) ---
sys_ticrate 1100
sv_maxrate 100000
sv_minrate 100000
sv_maxupdaterate 101
sv_minupdaterate 101

// --- Lag Compensation & Hit Registration ---
sv_unlag 1
sv_maxunlag 0.5
sv_unlagsamples 1
sv_unlagpush 0

// --- ReHLDS Optimizations & Hitbox Alignment ---
sv_rehlds_hull_centering 1
sv_rehlds_attachedentities_playeranimationspeed_fix 1
sv_rehlds_movecmd_clamp_interp 1

// --- Spectator & Camera Settings (5v5 In-Eye First Person Only) ---
mp_forcecamera 2
mp_forcechasecam 2
mp_fadetoblack 0

// --- Team Balance (Strictly Disabled for Competitive 5v5 Mix) ---
mp_autoteambalance 0
mp_limitteams 0

// --- AFK & Idle Protection (Disabled for Mix Matches) ---
gameland_afk_guard 0
mp_autokick 0

// --- Semiclip & Slots ---
sv_visiblemaxplayers 22
mp_semiclip 0
mp_semiclip_actions 0

// --- Voice Communication (Dead <-> Alive Teammate Audio) ---
sv_voiceenable 1
sv_alltalk 1
voice_enable 1
voice_forcemicrecord 1
sv_voicequality 5
sv_voicecodec "voice_speex"

// --- ReHLDS Anti-Burst Ban Protection ---
sv_rehlds_movecmdrate_avg_punish 0
sv_rehlds_movecmdrate_burst_punish 0
sv_rehlds_stringcmdrate_avg_punish 0
sv_rehlds_stringcmdrate_burst_punish 0

exec rehlds.cfg
exec gameland.cfg

