// ============================================================
// GameLand BasePack
// Main Server Configuration
// ============================================================

hostname "GameLand CS 1.6 #1 (Competitive)"

// --- Network & Tickrate Tuning ---
sys_ticrate 10000
sv_maxrate 100000
sv_minrate 50000
sv_maxupdaterate 102
sv_minupdaterate 100

// --- Spectator & Camera Settings (5v5 In-Eye First Person Only) ---
mp_forcecamera 2
mp_forcechasecam 2
mp_fadetoblack 0

// --- Team Balance (Strictly Disabled for Competitive 5v5 Mix) ---
mp_autoteambalance 0
mp_limitteams 0

// --- Dense & Natural Smoke Grenade ---
amx_smokegren_replacemode 2
amx_smokegren_pieces 12
amx_smokegren_color "110 110 110 255"
amx_smokegren_lifetime 25.0

// --- ReHLDS Optimizations ---
rehlds_movevars_transmit_all 1
rehlds_maxucommsgap 5

// --- AFK & Idle Protection (Disabled for Mix Matches) ---
gameland_afk_guard 0
mp_autokick 0

// --- Semiclip & Slots ---
sv_visiblemaxplayers 22
mp_semiclip 0
mp_semiclip_actions 0

// --- Voice Communication (Dead <-> Alive Teammate Audio) ---
sv_voiceenable 1
sv_alltalk 1
voice_enable 1
voice_forcemicrecord 1
sv_voicequality 5
sv_voicecodec "voice_speex"

// --- ReHLDS Anti-Burst Ban Protection ---
sv_rehlds_movecmdrate_avg_punish 0
sv_rehlds_movecmdrate_burst_punish 0
sv_rehlds_stringcmdrate_avg_punish 0
sv_rehlds_stringcmdrate_burst_punish 0

exec rehlds.cfg
exec gameland.cfg
