// ============================================================
// GameLand - Server Configuration
// ============================================================

// --------------------
// Server Identity (Configured dynamically per instance)
// --------------------

sv_cheats 0
sv_aim 0

// --------------------
// Remote Console (RCON)
// --------------------
rcon_password "GameLand@Rcon2026"

// --------------------
// Server Performance
// --------------------

pausable 0

sv_maxspeed 320

// --------------------
// Match Defaults
// Competitive mix server: no public map timer or automatic map rotation.
// The mix system controls round flow and map changes are admin-driven.
// --------------------

mp_timelimit 0

// --------------------
// Downloads / Files
// --------------------

sv_allowdownload 1
sv_allowupload 0

// --------------------
// Logging
// --------------------

log on

// --------------------
// Ban Files
// --------------------

exec listip.cfg
exec banned.cfg
