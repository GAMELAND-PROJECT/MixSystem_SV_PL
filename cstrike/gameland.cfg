// ============================================================
// GameLand - Server Configuration
// ============================================================

// --------------------
// Server Identity (Configured dynamically per instance)
// --------------------

sv_cheats 0
sv_aim 0

// --------------------
// Remote Console (RCON)
// --------------------
rcon_password "GameLand@Rcon2026"

// --------------------
// Server Performance
// --------------------

pausable 0
sv_maxspeed 320

// --------------------
// Match Defaults
// Competitive mix server: no public map timer or automatic map rotation.
// The mix system controls round flow and map changes are admin-driven.
// --------------------

mp_timelimit 0

// --------------------
// Competitive Dense Smoke (Zero-Lag Bloom & Static Sleep)
// --------------------
amx_smokegren_replacemode 2
amx_smokegren_pieces 6
amx_smokegren_color "175 175 175 209"
amx_smokegren_lifetime 25.0
amx_smokegren_fix_waterrender 1

// --------------------
// ReGameDLL Competitive & Physics Settings
// --------------------
mp_hullbounds_sets 1
mp_unduck_method 0
showtriggers 0

// --------------------
// Downloads / Files
// --------------------

sv_allowdownload 1
sv_allowupload 0

// --------------------
// Logging
// --------------------

log on

// --------------------
// Ban Files
// --------------------

exec listip.cfg
exec banned.cfg
