// ============================================================
// GameLand - Elite ReHLDS Competitive Network Configuration
// Russian ReHLDS Competitive Hitreg Standard (FastCup / Tournaments)
// ============================================================

// --------------------
// Network / Rate Tuning (Locked 101 Tick / 100K Rate)
// --------------------
rate 100000
sv_minrate 100000
sv_maxrate 100000

sv_minupdaterate 101
sv_maxupdaterate 101

sv_proxies 1

// --------------------
// Server Tickrate (1100 for stable 1000.0 FPS under Linux scheduler)
// --------------------
sys_ticrate 1100

// --------------------
// Lag Compensation & Hitreg
// --------------------
sv_unlag 1
sv_maxunlag 0.5
sv_unlagsamples 1
sv_unlagpush 0

// --------------------
// ReHLDS Movement & Hitbox Alignment
// --------------------
sv_rehlds_hull_centering 1
sv_rehlds_attachedentities_playeranimationspeed_fix 1
sv_rehlds_force_dlmax 1
sv_rehlds_local_gametime 0
sv_rehlds_send_mapcycle 0

// --------------------
// ReHLDS Client Interp & Command Safeguards
// --------------------
sv_rehlds_movecmd_clamp_interp 1
sv_rehlds_movecmd_max_null_streak 100
sv_rehlds_movecmd_max_ticks 24

// --------------------
// ReHLDS Rate Limiting & Protection (No false kicks / delays)
// --------------------
sv_rehlds_movecmdrate_max_avg 2500
sv_rehlds_movecmdrate_max_burst 12000
sv_rehlds_movecmdrate_avg_punish 0
sv_rehlds_movecmdrate_burst_punish 0

sv_rehlds_stringcmdrate_max_avg 500
sv_rehlds_stringcmdrate_max_burst 2500
sv_rehlds_stringcmdrate_avg_punish 0
sv_rehlds_stringcmdrate_burst_punish 0

sv_rehlds_maxclients_from_single_ip 5

// --------------------
// ReHLDS Engine Behavior & Optimization
// --------------------
sv_auto_precache_sounds_in_models 0
sv_echo_unknown_cmd 0
sv_delayed_spray_upload 1

