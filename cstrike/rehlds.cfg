// ============================================================
// GameLand - ReHLDS Competitive Network Configuration
// ============================================================

// --------------------
// Network / Rate
// --------------------

rate 100000

sv_minrate 25000
sv_maxrate 100000

sv_minupdaterate 101
sv_maxupdaterate 102

sv_mincmdrate 101
sv_maxcmdrate 105

sv_proxies 1

// --------------------
// Server Tick
// --------------------

sys_ticrate 1000

// --------------------
// Lag Compensation
// --------------------

sv_unlag 1
sv_maxunlag 0.5
sv_unlagsamples 1
sv_unlagpush 0

// --------------------
// ReHLDS Security / Limits
// --------------------

sv_rehlds_movecmdrate_max_avg 2000
sv_rehlds_movecmdrate_max_burst 10000
sv_rehlds_movecmdrate_avg_punish 0
sv_rehlds_movecmdrate_burst_punish 0

sv_rehlds_stringcmdrate_max_avg 400
sv_rehlds_stringcmdrate_max_burst 2000
sv_rehlds_stringcmdrate_avg_punish 0
sv_rehlds_stringcmdrate_burst_punish 0

sv_rehlds_maxclients_from_single_ip 5

// --------------------
// ReHLDS Behavior
// --------------------

sv_rehlds_force_dlmax 1
sv_rehlds_hull_centering 0

sv_auto_precache_sounds_in_models 0
sv_echo_unknown_cmd 0
